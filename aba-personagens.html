<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forçadex - Base de Dados</title>
  <style>
    /* Reset e estrutura básica */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    /* Fundo com camada overlay mais escura para aumentar o contraste do conteúdo */
    body {
      background: linear-gradient(rgba(11, 14, 20, 0.85), rgba(11, 14, 20, 0.92)),
                  url('bg-pokemon.jpg') no-repeat center center fixed;
      background-size: cover;
      color: #f1f5f9;
      min-height: 100vh;
      padding: 30px 16px;
    }

    /* Cabeçalho Principal */
    header {
      text-align: center;
      max-width: 860px;
      margin: 0 auto 30px auto;
    }

    .brand-header {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      margin-bottom: 10px;
    }

    /* Espaço reservado para a imagem da Pokédex */
    .pokedex-box {
      width: 50px;
      height: 50px;
      border-radius: 8px;
      background: #1e293b;
      border: 2px solid #334155;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      flex-shrink: 0;
    }

    .pokedex-box img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    header h1 {
      font-size: 2.8rem;
      font-weight: 900;
      letter-spacing: 3px;
      color: #ffffff;
      text-transform: uppercase;
      text-shadow: 0 3px 12px rgba(0, 0, 0, 0.9);
    }

    /* Frase de apresentação com alta legibilidade */
    header .intro-text {
      color: #cbd5e1;
      font-size: 0.98rem;
      max-width: 620px;
      margin: 0 auto 20px auto;
      line-height: 1.6;
      text-shadow: 0 2px 6px rgba(0, 0, 0, 0.9);
    }

    header .intro-text span {
      color: #38bdf8;
      font-weight: 600;
    }

    /* Painel de Controle de Jogo (HUD) */
    .controls-bar {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7);
      display: flex;
      flex-direction: column;
      gap: 16px;
      align-items: center;
    }

    /* Luzes LED de status */
    .pokedex-leds {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .led-main {
      width: 18px;
      height: 18px;
      background: #2563eb;
      border-radius: 50%;
      border: 2px solid #ffffff;
      box-shadow: 0 0 8px #2563eb;
    }

    .led-small {
      width: 8px;
      height: 8px;
      border-radius: 50%;
    }

    .led-red { background: #ef4444; }
    .led-yellow { background: #eab308; }
    .led-green { background: #22c55e; }

    /* Campo de Busca */
    .search-box {
      width: 100%;
      max-width: 420px;
    }

    .search-box input {
      width: 100%;
      padding: 11px 16px;
      border-radius: 8px;
      border: 1px solid #334155;
      background: #0f172a;
      color: #f8fafc;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s;
    }

    .search-box input:focus {
      border-color: #38bdf8;
    }

    .search-box input::placeholder {
      color: #64748b;
    }

    /* Botões de Filtro estilo Pokédex / Categorias por Cor */
    .filter-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
    }

    .tag-btn {
      background: #0f172a;
      border: 1px solid #334155;
      color: #cbd5e1;
      padding: 6px 14px;
      border-radius: 6px;
      font-size: 0.8rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.15s ease;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .tag-btn:hover {
      background: #334155;
      color: #ffffff;
    }

    /* Cores características de cada tipo ao ativar */
    .tag-btn[data-filter="all"].active { background: #38bdf8; color: #0f172a; border-color: #38bdf8; }
    .tag-btn[data-filter="bug"].active { background: #65a30d; color: #ffffff; border-color: #65a30d; }
    .tag-btn[data-filter="fire"].active { background: #dc2626; color: #ffffff; border-color: #dc2626; }
    .tag-btn[data-filter="poison"].active { background: #9333ea; color: #ffffff; border-color: #9333ea; }
    .tag-btn[data-filter="smoke"].active { background: #475569; color: #ffffff; border-color: #475569; }
    .tag-btn[data-filter="manipulator"].active { background: #0284c7; color: #ffffff; border-color: #0284c7; }
    .tag-btn[data-filter="honey"].active { background: #d97706; color: #ffffff; border-color: #d97706; }
    .tag-btn[data-filter="fav"].active { background: #e11d48; color: #ffffff; border-color: #e11d48; }

    .counter-text {
      font-size: 0.85rem;
      color: #94a3b8;
      font-weight: 600;
    }

    /* Grid de Cards */
    .forcamon-grid {
      max-width: 1200px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 24px;
      padding: 10px 0;
    }

    /* Card da Criatura */
    .card-item {
      position: relative;
      background: #1e293b;
      border-radius: 10px;
      overflow: hidden;
      border: 1px solid #334155;
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.6);
      transition: transform 0.2s ease, border-color 0.2s ease;
      cursor: pointer;
      display: flex;
      flex-direction: column;
    }

    .card-item:hover {
      transform: translateY(-4px);
      border-color: #38bdf8;
      box-shadow: 0 10px 24px rgba(0, 0, 0, 0.8);
    }

    .card-thumb {
      width: 100%;
      aspect-ratio: 3 / 4;
      background: #0f172a;
      overflow: hidden;
    }

    .card-thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: top center;
      display: block;
    }

    /* Rodapé do Card */
    .card-label {
      padding: 12px 14px;
      background: #0f172a;
      border-top: 1px solid #334155;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .card-info-left {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .mini-pokeball {
      width: 14px;
      height: 14px;
      opacity: 0.5;
    }

    .card-name {
      font-weight: 700;
      font-size: 0.95rem;
      color: #f8fafc;
    }

    .card-num {
      font-size: 0.8rem;
      color: #38bdf8;
      font-weight: 700;
      font-family: monospace;
    }

    /* Botão Favoritar */
    .fav-btn {
      position: absolute;
      top: 10px;
      right: 10px;
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid #334155;
      color: #94a3b8;
      width: 32px;
      height: 32px;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1rem;
      cursor: pointer;
      transition: all 0.15s ease;
      z-index: 2;
    }

    .fav-btn:hover {
      background: #1e293b;
      color: #ffffff;
    }

    .fav-btn.active {
      color: #ef4444;
      background: #ffffff;
      border-color: #ffffff;
    }

    /* Modal de Visualização */
    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-color: rgba(0, 0, 0, 0.92);
      z-index: 1000;
      justify-content: center;
      align-items: center;
      opacity: 0;
      transition: opacity 0.2s ease;
      overflow: hidden;
    }

    .modal.active {
      display: flex;
      opacity: 1;
    }

    .modal-content-wrapper {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .modal-content {
      max-width: 88vw;
      max-height: 86vh;
      border-radius: 8px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.9);
      object-fit: contain;
      cursor: zoom-in;
      user-select: none;
      will-change: transform;
    }

    .close-btn {
      position: absolute;
      top: 20px;
      right: 25px;
      font-size: 2rem;
      color: #94a3b8;
      cursor: pointer;
      user-select: none;
      z-index: 1002;
      transition: color 0.15s;
    }

    .close-btn:hover {
      color: #ffffff;
    }

    .nav-arrow {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      font-size: 1.5rem;
      color: #ffffff;
      background: #1e293b;
      border: 1px solid #334155;
      width: 46px;
      height: 46px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 8px;
      cursor: pointer;
      user-select: none;
      z-index: 1002;
      transition: background 0.15s;
    }

    .nav-arrow:hover {
      background: #38bdf8;
      color: #0f172a;
    }

    .prev-btn { left: 20px; }
    .next-btn { right: 20px; }

    .zoom-hint {
      position: absolute;
      bottom: 20px;
      color: #94a3b8;
      font-size: 0.8rem;
      pointer-events: none;
      background: #1e293b;
      padding: 6px 16px;
      border-radius: 6px;
      border: 1px solid #334155;
      z-index: 1001;
    }

    @media (max-width: 600px) {
      header h1 { font-size: 2rem; }
      .forcamon-grid { grid-template-columns: 1fr; }
      .prev-btn { left: 10px; }
      .next-btn { right: 10px; }
    }
  </style>
</head>
<body>

  <header>
    <!-- Título com a caixa reservada para a imagem da Pokédex -->
    <div class="brand-header">
      <div class="pokedex-box">
        <img src="pokedex.png" alt="Pokédex" onerror="this.style.display='none';">
      </div>
      <h1>FORÇADEX</h1>
    </div>

    <!-- Frase descritiva limpa -->
    <p class="intro-text">O santuário digital definitivo onde você pode explorar e analisar todos os <span>Forçamons</span> habitantes deste universo.</p>

    <!-- Controles de Filtro e Busca -->
    <div class="controls-bar">
      
      <div class="pokedex-leds">
        <span class="led-main"></span>
        <span class="led-small led-red"></span>
        <span class="led-small led-yellow"></span>
        <span class="led-small led-green"></span>
      </div>

      <div class="search-box">
        <input type="text" id="searchInput" placeholder="Buscar por nome da criatura...">
      </div>

      <!-- Filtros por tipo com cores próprias -->
      <div class="filter-tags">
        <button class="tag-btn active" data-filter="all">Todos</button>
        <button class="tag-btn" data-filter="bug">Inseto</button>
        <button class="tag-btn" data-filter="fire">Fogo</button>
        <button class="tag-btn" data-filter="poison">Venenoso</button>
        <button class="tag-btn" data-filter="smoke">Fumaça</button>
        <button class="tag-btn" data-filter="manipulator">Manipulador</button>
        <button class="tag-btn" data-filter="honey">Mel</button>
        <button class="tag-btn" data-filter="fav">♥ Favoritos</button>
      </div>

      <div class="counter-text" id="counterText">Exibindo 4 Forçamons</div>
    </div>
  </header>

  <main class="forcamon-grid" id="forcamonGrid">

    <!-- Card Nildrill -->
    <div class="card-item" data-name="nildrill" data-types="bug poison honey" data-fav="false">
      <button class="fav-btn" title="Favoritar">♥</button>
      <div class="card-thumb">
        <img src="personagens/Nildrill - forcamon.jpg" alt="Nildrill">
      </div>
      <div class="card-label">
        <div class="card-info-left">
          <svg class="mini-pokeball" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
            <circle cx="50" cy="50" r="45" stroke="#ffffff" stroke-width="10"/>
            <line x1="5" y1="50" x2="95" y2="50" stroke="#ffffff" stroke-width="10"/>
            <circle cx="50" cy="50" r="14" fill="#ffffff"/>
          </svg>
          <span class="card-name">Nildrill</span>
        </div>
        <span class="card-num">#0015</span>
      </div>
    </div>

    <!-- Card Rubizard -->
    <div class="card-item" data-name="rubizard" data-types="fire" data-fav="false">
      <button class="fav-btn" title="Favoritar">♥</button>
      <div class="card-thumb">
        <img src="personagens/Rubizard - forcamon.jpg" alt="Rubizard">
      </div>
      <div class="card-label">
        <div class="card-info-left">
          <svg class="mini-pokeball" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
            <circle cx="50" cy="50" r="45" stroke="#ffffff" stroke-width="10"/>
            <line x1="5" y1="50" x2="95" y2="50" stroke="#ffffff" stroke-width="10"/>
            <circle cx="50" cy="50" r="14" fill="#ffffff"/>
          </svg>
          <span class="card-name">Rubizard</span>
        </div>
        <span class="card-num">#0006</span>
      </div>
    </div>

    <!-- Card Vianalax -->
    <div class="card-item" data-name="vianalax" data-types="normal" data-fav="false">
      <button class="fav-btn" title="Favoritar">♥</button>
      <div class="card-thumb">
        <img src="personagens/Vianalax - forcamon.jpg" alt="Vianalax">
      </div>
      <div class="card-label">
        <div class="card-info-left">
          <svg class="mini-pokeball" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
            <circle cx="50" cy="50" r="45" stroke="#ffffff" stroke-width="10"/>
            <line x1="5" y1="50" x2="95" y2="50" stroke="#ffffff" stroke-width="10"/>
            <circle cx="50" cy="50" r="14" fill="#ffffff"/>
          </svg>
          <span class="card-name">Vianalax</span>
        </div>
        <span class="card-num">#0143</span>
      </div>
    </div>

    <!-- Card Violetwo -->
    <div class="card-item" data-name="violetwo" data-types="psychic" data-fav="false">
      <button class="fav-btn" title="Favoritar">♥</button>
      <div class="card-thumb">
        <img src="personagens/Violetwo - forcamon.jpg" alt="Violetwo">
      </div>
      <div class="card-label">
        <div class="card-info-left">
          <svg class="mini-pokeball" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
            <circle cx="50" cy="50" r="45" stroke="#ffffff" stroke-width="10"/>
            <line x1="5" y1="50" x2="95" y2="50" stroke="#ffffff" stroke-width="10"/>
            <circle cx="50" cy="50" r="14" fill="#ffffff"/>
          </svg>
          <span class="card-name">Violetwo</span>
        </div>
        <span class="card-num">#0150</span>
      </div>
    </div>

  </main>

  <!-- Modal para visualização expandida do card -->
  <div class="modal" id="imageModal">
    <span class="close-btn" id="closeBtn">&times;</span>
    <span class="nav-arrow prev-btn" id="prevBtn">&#10094;</span>
    <span class="nav-arrow next-btn" id="nextBtn">&#10095;</span>

    <div class="modal-content-wrapper" id="wrapper">
      <img class="modal-content" id="modalImg" alt="Card Expandido" draggable="false">
    </div>
    
    <div class="zoom-hint">Scroll = Zoom | Arraste = Mover | Setas = Navegar</div>
  </div>

  <script>
    const modal = document.getElementById('imageModal');
    const modalImg = document.getElementById('modalImg');
    const closeBtn = document.getElementById('closeBtn');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const searchInput = document.getElementById('searchInput');
    const tagBtns = document.querySelectorAll('.tag-btn');
    const counterText = document.getElementById('counterText');
    const allCards = Array.from(document.querySelectorAll('.card-item'));

    let visibleCards = [...allCards];
    let currentIndex = 0;
    let currentFilter = 'all';

    let scale = 1;
    let isDragging = false;
    let startX = 0, startY = 0;
    let translateX = 0, translateY = 0;

    allCards.forEach(card => {
      const favBtn = card.querySelector('.fav-btn');
      
      favBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        const isFav = card.dataset.fav === 'true';
        card.dataset.fav = !isFav;
        favBtn.classList.toggle('active', !isFav);
        applyFilters();
      });

      card.addEventListener('click', () => {
        const indexInVisible = visibleCards.indexOf(card);
        if (indexInVisible !== -1) {
          currentIndex = indexInVisible;
          loadCard(currentIndex);
          modal.classList.add('active');
        }
      });
    });

    function applyFilters() {
      const query = searchInput.value.toLowerCase().trim();

      visibleCards = allCards.filter(card => {
        const name = card.dataset.name.toLowerCase();
        const types = card.dataset.types.toLowerCase();
        const isFav = card.dataset.fav === 'true';

        const matchesSearch = name.includes(query);
        let matchesFilter = true;

        if (currentFilter === 'fav') {
          matchesFilter = isFav;
        } else if (currentFilter !== 'all') {
          matchesFilter = types.includes(currentFilter);
        }

        return matchesSearch && matchesFilter;
      });

      allCards.forEach(card => {
        card.style.display = visibleCards.includes(card) ? 'flex' : 'none';
      });

      counterText.textContent = `Exibindo ${visibleCards.length} de ${allCards.length} Forçamons`;
    }

    searchInput.addEventListener('input', applyFilters);

    tagBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        tagBtns.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentFilter = btn.dataset.filter;
        applyFilters();
      });
    });

    function loadCard(index) {
      if (visibleCards.length === 0) return;

      if (index < 0) index = visibleCards.length - 1;
      if (index >= visibleCards.length) index = 0;
      currentIndex = index;

      const img = visibleCards[currentIndex].querySelector('img');
      modalImg.src = img.src;
      modalImg.alt = img.alt;
      resetZoom();
    }

    function updateTransform() {
      modalImg.style.transform = `translate(${translateX}px, ${translateY}px) scale(${scale})`;
    }

    function updateCursor() {
      if (scale > 1) {
        modalImg.style.cursor = isDragging ? 'grabbing' : 'grab';
      } else {
        modalImg.style.cursor = 'zoom-in';
      }
    }

    modal.addEventListener('wheel', (e) => {
      e.preventDefault();

      if (e.deltaY < 0) {
        scale = Math.min(scale + 0.3, 4);
      } else {
        scale = Math.max(scale - 0.3, 1);
        if (scale === 1) {
          translateX = 0;
          translateY = 0;
        }
      }

      updateCursor();
      updateTransform();
    }, { passive: false });

    modalImg.addEventListener('mousedown', (e) => {
      if (scale > 1) {
        isDragging = true;
        startX = e.clientX - translateX;
        startY = e.clientY - translateY;
        updateCursor();
        e.preventDefault();
      }
    });

    window.addEventListener('mousemove', (e) => {
      if (!isDragging) return;
      translateX = e.clientX - startX;
      translateY = e.clientY - startY;
      updateTransform();
    });

    window.addEventListener('mouseup', () => {
      if (isDragging) {
        isDragging = false;
        updateCursor();
      }
    });

    prevBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      loadCard(currentIndex - 1);
    });

    nextBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      loadCard(currentIndex + 1);
    });

    closeBtn.addEventListener('click', closeModal);

    modal.addEventListener('click', (e) => {
      if ((e.target === modal || e.target.id === 'wrapper') && !isDragging) {
        closeModal();
      }
    });

    document.addEventListener('keydown', (e) => {
      if (!modal.classList.contains('active')) return;

      if (e.key === 'Escape') closeModal();
      if (e.key === 'ArrowLeft') loadCard(currentIndex - 1);
      if (e.key === 'ArrowRight') loadCard(currentIndex + 1);
    });

    function resetZoom() {
      scale = 1;
      translateX = 0;
      translateY = 0;
      isDragging = false;
      updateTransform();
      updateCursor();
    }

    function closeModal() {
      modal.classList.remove('active');
      resetZoom();
    }
  </script>

</body>
</html>
